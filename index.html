<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GMK Basket Calculator</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdn.sheetjs.com; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://api.github.com https://raw.githubusercontent.com; img-src data: blob:; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f4f9; --surface:#ffffff; --line:#e3e7ef; --line2:#cfd6e2; --text:#0e1a2e; --muted:#5a6a80; --faint:#8b97aa;
  --brand:#1d3b9e; --brand-2:#2f5bea; --brand-soft:#edf1ff; --navy:#0a1a38;
  --ok:#137a3d; --ok-soft:#e6f5ec; --ok-c:#22a05a;
  --warn:#a85a06; --warn-soft:#fdf2e1; --warn-c:#f0a020;
  --bad:#b72424; --bad-soft:#fdeaea; --bad-c:#e04848;
  --grad-brand:linear-gradient(135deg,#0b2a7a 0%,#1f4fd8 55%,#4f8bff 100%);
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);
  --shadow-md:0 6px 16px rgba(16,24,40,.08);
  --shadow-lg:0 18px 40px rgba(10,26,56,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;
  background:radial-gradient(1000px 500px at 0% 0%,#e6ecff 0%,transparent 60%),radial-gradient(900px 500px at 100% 0%,#e3f4f7 0%,transparent 55%),var(--bg);background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit;color:inherit}
.ic{flex:none;display:inline-block;vertical-align:middle}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* ---------- LOCK ---------- */
.lock{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(1200px 600px at 15% 10%,#2443a8 0%,transparent 60%),radial-gradient(900px 600px at 90% 90%,#0b5566 0%,transparent 60%),var(--navy);transition:opacity .35s ease}
.lock.out{opacity:0;pointer-events:none}
.lock::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(circle at center,#000 30%,transparent 75%)}
.lock-card{position:relative;width:340px;max-width:calc(100vw - 32px);background:rgba(255,255,255,.98);border-radius:22px;padding:32px 28px 24px;box-shadow:0 30px 80px rgba(0,0,0,.35);text-align:center}
.logo{display:grid;place-items:center;color:#fff;background:var(--grad-brand);font-weight:800;letter-spacing:.02em;box-shadow:0 8px 20px rgba(47,91,234,.35)}
.lock-card .logo{width:60px;height:60px;border-radius:17px;margin:0 auto 16px;font-size:17px}
.lock-card h1{font-size:20px;font-weight:800;letter-spacing:-.015em}
.lock-card h1 span,.brand-t span{background:var(--grad-brand);-webkit-background-clip:text;background-clip:text;color:transparent}
.lock-card p{color:var(--muted);font-size:13px;margin-top:4px}
.pin-dots{display:flex;gap:14px;justify-content:center;margin:24px 0 22px}
.pin-dots span{width:14px;height:14px;border-radius:50%;border:2px solid var(--line2);transition:all .15s}
.pin-dots span.on{background:var(--brand-2);border-color:var(--brand-2)}
.pin-dots.err span{border-color:var(--bad-c);background:var(--bad-c)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{height:54px;border-radius:12px;background:#f3f5fa;font-size:20px;font-weight:600;transition:background .12s,transform .08s;display:grid;place-items:center}
.key:hover{background:#e8ecf5}
.key:active{transform:scale(.96);background:#dde3f0}
.key.blank{visibility:hidden}
.lock-msg{height:18px;margin-top:14px;font-size:12.5px;color:var(--bad);font-weight:500}
.lock-foot{margin-top:6px;font-size:11.5px;color:var(--faint);display:flex;gap:6px;align-items:center;justify-content:center}

/* ---------- TOP BAR ---------- */
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.88);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1200px;margin:0 auto;height:64px;padding:0 24px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:11px;min-width:0;cursor:pointer}
.brand .logo{width:38px;height:38px;border-radius:11px;font-size:12px}
.brand-t{font-weight:800;font-size:16px;letter-spacing:-.015em;white-space:nowrap}
.brand-s{font-size:11.5px;color:var(--muted);white-space:nowrap}
.crumb{display:flex;align-items:center;gap:8px;margin-left:8px;padding-left:16px;border-left:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.crumb b{color:var(--text)}
.crumb a{cursor:pointer}.crumb a:hover{color:var(--brand-2)}
.top-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.sync{display:flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--muted);white-space:nowrap}
.sync .d{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.sync.synced .d{background:var(--ok-c);box-shadow:0 0 0 3px rgba(34,160,90,.18)}
.sync.saving .d,.sync.pending .d{background:var(--warn-c);animation:pulse 1s infinite}
.sync.error{color:var(--bad);border-color:#f3c9c9;background:var(--bad-soft)}
.sync.error .d{background:var(--bad-c)}
@keyframes pulse{50%{opacity:.35}}
.icon-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted);border:1px solid var(--line);background:#fff;transition:all .12s}
.icon-btn:hover{color:var(--text);background:#f5f7fb;border-color:var(--line2)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 16px;border-radius:10px;font-weight:600;font-size:13.5px;transition:all .15s;white-space:nowrap}
.btn.sm{height:32px;padding:0 12px;font-size:12.5px}
.btn.lg{height:46px;padding:0 22px;font-size:15px}
.btn.primary{background:var(--grad-brand);color:#fff;box-shadow:0 4px 12px rgba(31,79,216,.28)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--text)}
.btn.ghost:hover{background:#f6f8fb;border-color:var(--line2)}
.btn.soft{background:var(--brand-soft);color:var(--brand)}
.btn.soft:hover{background:#e2e8ff}
.btn.danger{color:var(--bad);background:#fff;border:1px solid #f1d0d0}
.btn.danger:hover{background:var(--bad-soft)}
.btn.red{background:linear-gradient(135deg,#ef4444,#b91c1c);color:#fff}
.mini{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--faint);flex:none;transition:background .12s,color .12s}
.mini:hover{background:var(--brand-soft);color:var(--brand-2)}
.mini.del:hover{background:var(--bad-soft);color:var(--bad)}

.page{max-width:1200px;margin:0 auto;padding:28px 24px 64px}

/* Report Studio link */
.rs-btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:999px;font-size:12.5px;font-weight:700;color:#fff;text-decoration:none;white-space:nowrap;
  background:linear-gradient(135deg,#7c3aed 0%,#c026d3 55%,#f97316 100%);box-shadow:0 4px 12px rgba(192,38,211,.3);transition:filter .15s,transform .15s}
.rs-btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.rs-box{display:flex;align-items:center;gap:14px;margin:-4px 0 16px;padding:14px 16px;border-radius:14px;color:#fff;
  background:linear-gradient(135deg,#6d28d9 0%,#a21caf 55%,#ea580c 100%);box-shadow:0 8px 20px rgba(162,28,175,.25)}
.rs-ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.18);flex:none}
.rs-txt{flex:1;display:flex;flex-direction:column;gap:2px}.rs-txt b{font-size:15px}.rs-txt span{font-size:12.5px;opacity:.9}
.rs-go{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 16px;border-radius:10px;background:#fff;color:#7e22ce;font-weight:700;font-size:13.5px;text-decoration:none;white-space:nowrap}
.rs-go:hover{background:#faf5ff}

/* ---------- HOME ---------- */
.hello{margin:6px 0 24px}
.hello .eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-2)}
.hello h2{font-size:28px;font-weight:800;letter-spacing:-.025em;margin-top:4px}
.hello p{color:var(--muted);margin-top:4px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.cc{position:relative;background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;overflow:hidden}
.cc::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--grad-brand)}
.cc:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:#c7d3f5}
.cc-top{display:flex;align-items:center;gap:12px}
.cc-ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;background:var(--grad-brand);box-shadow:0 6px 14px rgba(31,79,216,.25);flex:none}
.cc-name{font-size:18px;font-weight:800;letter-spacing:-.015em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-sub{color:var(--muted);font-size:13px;margin-top:14px}
.prog{height:8px;border-radius:99px;background:#eef1f6;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#16a34a,#4ade80);border-radius:99px;transition:width .4s}
.cc-foot{display:flex;align-items:center;margin-top:14px;font-size:12.5px;font-weight:600}
.cc-foot .go{margin-left:auto;color:var(--brand-2);display:flex;align-items:center;gap:6px;transition:gap .15s}
.cc:hover .go{gap:10px}
.cc.add{border:2px dashed var(--line2);background:rgba(255,255,255,.6);box-shadow:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:170px;color:var(--brand-2);font-weight:700}
.cc.add::before{display:none}
.cc.add:hover{background:#fff;border-color:#9fb3f0}
.cc.add .cc-ic{background:var(--brand-soft);color:var(--brand-2);box-shadow:none}

.big-empty{text-align:center;padding:50px 20px;background:#fff;border:1.5px dashed var(--line2);border-radius:18px;color:var(--muted)}
.big-empty .e-ic{width:58px;height:58px;border-radius:16px;margin:0 auto 14px;display:grid;place-items:center;color:#fff;background:var(--grad-brand)}
.big-empty b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}
.big-empty .btn{margin-top:16px}

/* ---------- CLIENT PAGE ---------- */
.bar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.bar .sp{flex:1}
.title{display:flex;align-items:flex-end;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.title h2{font-size:28px;font-weight:800;letter-spacing:-.025em}
.title p{color:var(--muted);margin-top:3px}
.title .sp{flex:1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:18px}
.panel-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#f7f9ff,#fff)}
.ph-title{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15.5px;flex:1;min-width:0}
.ph-title .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fid{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:700;font-size:13px;background:var(--brand-soft);color:var(--brand);border:1px solid #d6dffb;padding:3px 9px;border-radius:7px;white-space:nowrap}
.count{font-size:12px;font-weight:600;color:var(--muted);background:#f1f4f9;border-radius:999px;padding:3px 9px;white-space:nowrap}
.crow{display:flex;align-items:center;gap:14px;padding:14px 18px;border-top:1px solid #eef1f6;cursor:pointer;transition:background .12s}
.crow:first-child{border-top:0}
.crow:hover{background:#f6f8ff}
.cr-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#0b6475;background:#e6f6f8;flex:none}
.cr-main{flex:1;min-width:0}
.cr-name{font-weight:700;font-size:14.5px}
.cr-sub{font-size:12.5px;color:var(--muted);margin-top:1px}
.st{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap}
.st.ok{background:var(--ok-soft);color:var(--ok)}
.st.pend{background:var(--warn-soft);color:var(--warn)}
.crow .chev{color:var(--faint)}
.filters{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.search{position:relative;flex:1;min-width:240px}
.search .ic{position:absolute;left:12px;top:11px;color:var(--faint)}
.search input,.sel{height:38px;border:1px solid var(--line2);border-radius:10px;background:#fff;outline:none;font-size:13.5px;transition:border-color .12s,box-shadow .12s}
.search input{width:100%;padding:0 12px 0 36px}
.sel{padding:0 10px;min-width:200px}
.search input:focus,.sel:focus{border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(47,91,234,.12)}
.panel.fund{margin-bottom:12px}
.fund-head{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;transition:background .12s}
.fund-head:hover{background:#f7f9ff}
.fchev{color:var(--faint);transition:transform .2s;display:grid}
.fund.open .fchev{transform:rotate(90deg);color:var(--brand-2)}
.fund.open .fund-head{background:linear-gradient(90deg,#f3f6ff,#fff);border-bottom:1px solid var(--line)}
.fh-main{flex:1;min-width:0}
.fh-top{display:flex;align-items:center;gap:9px;min-width:0}
.fidbig{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:800;font-size:16px;white-space:nowrap}
.panel.fund.tinted{background:var(--pbg);border-color:var(--pbd);border-left:5px solid var(--pac)}
.panel.fund.tinted .fund-head:hover{background:rgba(255,255,255,.6)}
.panel.fund.tinted.open .fund-head{background:rgba(255,255,255,.55);border-bottom-color:var(--pbd)}
.panel.fund.tinted .crow{border-top-color:var(--pbd)}
.panel.fund.tinted .crow:hover{background:rgba(255,255,255,.6)}
.pchip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 9px;border-radius:999px;font-weight:700;font-size:12px;background:#f1f4f9;color:var(--muted)}
.tinted .pchip{background:#fff;color:var(--ptx);border:1px solid var(--pbd)}
.tinted .pchip .ic{color:var(--pac)}
/* pending lists */
.pend{margin-top:14px;padding:12px;border-radius:12px;background:#fbfcfe;border:1px solid var(--line)}
.pend-t{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--warn);margin-bottom:8px}
.prow{display:flex;align-items:baseline;gap:6px;padding:6px 9px;border-radius:8px;margin-top:5px;font-size:13px;background:var(--pbg,#f1f4f9);border-left:4px solid var(--pac,#94a3b8)}
.prow b{color:var(--ptx,var(--text));white-space:nowrap}
.prow .ids{color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.6}
.prow .ids a{cursor:pointer;color:var(--ptx,var(--brand));font-weight:600}
.prow .ids a:hover{text-decoration:underline}
.ready{margin-top:14px;padding:12px;border-radius:12px;background:var(--ok-soft);border:1px solid #bfe5cb;color:var(--ok);font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ready .btn{margin-left:auto}
.pend-panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:16px;box-shadow:var(--shadow)}
.pend-panel .pend-t{margin-bottom:4px}
.pend-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:0 10px}
.srctag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:#eef2ff;color:var(--brand);white-space:nowrap}
.btn[disabled]{opacity:.5;cursor:not-allowed;filter:none!important}
.btn.up{background:#fff;border:1px solid var(--line2);color:var(--brand)}
.btn.up:hover{border-color:var(--brand-2);background:var(--brand-soft)}
.st.bad{background:var(--bad-soft);color:var(--bad);max-width:320px;overflow:hidden;text-overflow:ellipsis}
.ccode{font-size:11px;font-weight:700;color:#0b6475;background:#e6f6f8;border-radius:6px;padding:2px 7px;margin-left:6px}
.valbox{position:relative;display:flex;align-items:center;gap:10px;margin-top:10px;padding:12px 14px;border-radius:12px;background:#e4f2ff;border:1px solid #9cc9f2}
.valbox span{flex:1;display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;color:#0b4f8a}
.valbox b{font-size:17px;font-weight:800;color:#0b3a66}
.valbox input{width:34px;height:30px;border:1px solid #9cc9f2;border-radius:8px;background:#fff;color:transparent;cursor:pointer;padding:0 4px}
.valbox input::-webkit-datetime-edit{display:none}
.errbox,.okbox{display:flex;gap:8px;align-items:flex-start;margin-top:10px;padding:10px 12px;border-radius:10px;font-size:12.5px}
.errbox{background:var(--bad-soft);color:var(--bad)}
.okbox{background:var(--ok-soft);color:var(--ok)}
.fname{color:var(--muted);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fh-sub{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted);margin-top:4px}
.fh-sub .dot{color:var(--faint)}
.fund-body .crow{padding-left:46px}
.fund-body .crow.add{padding-left:18px}
.st.none{background:#f1f4f9;color:var(--muted)}
.crow.add{justify-content:center;color:var(--brand-2);font-weight:600;font-size:13px;gap:7px}

/* ---------- DRAWER (calculator) ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,20,40,.32);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:41;width:500px;max-width:100vw;background:#fff;box-shadow:var(--shadow-lg);transform:translateX(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.drawer.show{transform:none}
.d-head{position:relative;padding:20px 22px 18px;display:flex;gap:14px;align-items:flex-start;color:#fff;background:var(--grad-brand);overflow:hidden}
.d-head::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.35) 1px,transparent 1.3px);background-size:18px 18px;mask-image:linear-gradient(120deg,transparent 40%,#000 100%);pointer-events:none}
.d-head > *{position:relative;z-index:1}
.d-ic{width:48px;height:48px;border-radius:13px;display:grid;place-items:center;background:rgba(255,255,255,.18);flex:none}
.d-who{flex:1;min-width:0}
.d-name{font-size:20px;font-weight:800;letter-spacing:-.01em}
.d-role{font-size:12.5px;color:rgba(255,255,255,.82);font-weight:500;margin-top:1px}
.d-meta{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:8px;background:rgba(255,255,255,.16);color:#fff;font-size:12px;font-weight:600;border:1px solid rgba(255,255,255,.25)}
button.tag:hover{background:rgba(255,255,255,.28)}
.x-btn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.16)}
.x-btn:hover{background:rgba(255,255,255,.3)}
.d-body{flex:1;overflow-y:auto;padding:20px 22px 24px}
.d-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;background:#fbfcfe}
.d-foot .sp{flex:1}
.saved{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.saved.ok{color:var(--ok)}.saved.no{color:var(--warn)}

/* ===================== SECURITY / CRYPTO (same scheme as WorkBoard) ===================== */
const session = { key: null, token: '', pin: '', conn: null };
const te = new TextEncoder(), td = new TextDecoder();
const toB64 = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };

  const base = await crypto.subtle.importKey('raw', te.encode(pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: fromB64(saltB64), iterations: 310000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}

  const salt = toB64(crypto.getRandomValues(new Uint8Array(16)));
  const box = await seal(await deriveKey(pin, salt), payload);
  return 'WB1.' + btoa(JSON.stringify({ s: salt, i: box.iv, c: box.ct }));
}

  const o = JSON.parse(atob(String(code).trim().replace(/^WB1\./, '')));

}

/* ===================== GITHUB SYNC ===================== */
const OK_NAME = /^[A-Za-z0-9_.-]{1,100}$/, OK_PATH = /^[A-Za-z0-9_\/.-]{1,200}\.json$/;
function gh(over) {
  const saved = over || session.conn || {};
  const c = { ...CONFIG.github };
  ['owner', 'repo', 'branch', 'path'].forEach(k => { if (saved[k]) c[k] = saved[k]; });
  if (!c.owner && location.hostname.endsWith('.github.io')) c.owner = location.hostname.split('.')[0];
  c.token = over && over.token !== undefined ? over.token : session.token;
  return c;
}
function validConn(c) {
  if (!OK_NAME.test(c.owner) || !OK_NAME.test(c.repo) || !OK_NAME.test(c.branch) || !OK_PATH.test(c.path) || c.path.includes('..')) throw new Error('Repository details contain invalid characters');
  if (!/^(github_pat_|ghp_)[A-Za-z0-9_]{20,}$/.test(c.token)) throw new Error('That does not look like a GitHub access key');
}
const mode = () => { const c = gh(); return c.owner && c.repo && c.token ? 'live' : 'local'; };
const encPath = p => p.split('/').map(encodeURIComponent).join('/');
function b64enc(str) { return toB64(te.encode(str)); }
function b64dec(b64) { return td.decode(fromB64(b64.replace(/\s/g, ''))); }
async function ghGet(c = gh()) {
  validConn(c);
  const url = `https://api.github.com/repos/${c.owner}/${c.repo}/contents/${encPath(c.path)}?ref=${encodeURIComponent(c.branch)}`;
  const r = await fetch(url, { headers: { Accept: 'application/vnd.github+json', Authorization: `Bearer ${c.token}` }, cache: 'no-store' });
  if (r.status === 404) return { sha: null, data: null };
  if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(`GitHub ${r.status}: ${j.message || r.statusText}`); }
  const j = await r.json();
  const text = j.content ? b64dec(j.content) : await (await fetch(j.download_url, { cache: 'no-store' })).text();
  if (text.length > 8e6) throw new Error('Data file is unexpectedly large — refusing to load');
  return { sha: j.sha, data: JSON.parse(text) };
}
async function ghPut(payload, sha, c = gh()) {
  validConn(c);
  const url = `https://api.github.com/repos/${c.owner}/${c.repo}/contents/${encPath(c.path)}`;
  const body = { message: `Basket Calculator update · ${new Date().toLocaleString('en-IN')}`, content: b64enc(JSON.stringify(payload, null, 1)), branch: c.branch };
  if (sha) body.sha = sha;
  const r = await fetch(url, { method: 'PUT', headers: { Accept: 'application/vnd.github+json', Authorization: `Bearer ${c.token}`, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (r.status === 409) return { conflict: true };
  if (r.status === 422) { const j = await r.json().catch(() => ({})); if (/sha|match|conflict/i.test(j.message || '')) return { conflict: true }; throw new Error(`GitHub 422: ${j.message}`); }
  if (r.status === 404 || r.status === 403) throw new Error('GitHub blocked the save — the access key needs "Contents: Read and write" on the data repo');
  if (r.status === 401) throw new Error('The access key is invalid or was deleted — redo Team sync setup');
  if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(`GitHub ${r.status}: ${j.message || r.statusText}`); }
  return { ok: true };
}

let pending = [], syncing = false, syncTimer = null, retryTimer = null, lastSync = null;
function setSync(state, msg = '') {
  const el = $('#sync'); el.className = 'sync ' + state;
  const txt = { local: 'On this device only', pending: 'Unsaved changes', saving: 'Saving…', synced: 'Synced' + (lastSync ? ' · ' + fmtTime(lastSync.toISOString()) : ''), error: 'Sync error' }[state];
  el.querySelector('.t').textContent = txt; el.title = msg || txt;
}
function stamp(d) { d.updatedAt = new Date().toISOString(); d.rev = uid(); }
// Every change is a small function. It runs here at once, then again on the newest copy from GitHub,
// so two people saving at the same time never wipe out each other's work.
function commit(op0, msg) {
  const op = d => { op0(d); d.colors = assignColors(d, d.colors); };
  op(data); stamp(data); saveLocal(); render();
  if (msg) toast(msg);
  if (mode() === 'live') { pending.push(op); queueSync(); }
}
function queueSync(delay = 500) { clearTimeout(syncTimer); setSync('pending'); syncTimer = setTimeout(doSync, delay); }
async function doSync() {
  if (syncing || !pending.length || mode() !== 'live') return;
  syncing = true; setSync('saving'); clearTimeout(retryTimer);
  let failed = false;
  try {
    let done = false;
    for (let attempt = 0; attempt < 4 && !done; attempt++) {
      const remote = await ghGet();
      const n = pending.length, ops = pending.slice(0, n);
      let merged;
      if (remote.data) { merged = normalize(remote.data); ops.forEach(op => { try { op(merged); } catch (e) {} }); }
      else merged = clone(data);
      stamp(merged);
      const res = await ghPut(merged, remote.sha);
      if (res.conflict) continue;
      const rest = pending.slice(n);
      const next = clone(merged); rest.forEach(op => { try { op(next); } catch (e) {} });
      if (rest.length) stamp(next);
      pending = rest; data = next; lastSync = new Date(); saveLocal(); render();
      setSync(pending.length ? 'pending' : 'synced'); done = true;
    }
    if (!done) throw new Error('Someone else is saving at the same time — retrying');
  } catch (e) {
    failed = true; setSync('error', e.message);
    if (Date.now() - (doSync.lastErr || 0) > 60000) { doSync.lastErr = Date.now(); toast('Not saved to team yet — will retry: ' + e.message, true); }
    retryTimer = setTimeout(doSync, 15000);

  if (!failed && pending.length) queueSync(300);
}
async function pull(force = false, quiet = false) {
  if (mode() === 'local') { setSync('local'); return; }
  if (!force && (document.hidden || syncing || pending.length)) return;
  try {
    const r = await ghGet();
    if (r.data && r.data.rev !== data.rev) { data = normalize(r.data); saveLocal(); render(); }
    lastSync = new Date(); setSync('synced');
    if (force && !quiet) toast('Up to date');
  } catch (e) { setSync('error', e.message); if (force && !quiet) toast(e.message, true); }
}

/* ===================== STATE STREET: iShares NAV price file (.xlsx) =====================
   Sheet "General Price file": one row per ISIN per currency. Rule: take the row where ISIN = class ISIN and Currency = USD →
   NAV (col J) = totalNetAssets · NAV per share (col G) = navPerShare · Shares in Issue (col K) = sharesOutstanding · NAV Date (col A) = val. date */
async function readNavFile(file) {
  if (!window.XLSX) { toast('Preparing file reader…'); await loadScript('https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js'); }
  const X = window.XLSX, wb = X.read(await file.arrayBuffer(), { type: 'array' });
  for (const name of wb.SheetNames) {
    const rows = X.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: true, defval: '' });
    const hi = rows.findIndex(r => r.some(v => String(v).trim().toUpperCase() === 'ISIN')); if (hi < 0) continue;
    const H = rows[hi].map(v => String(v).trim().toLowerCase()), col = n => H.indexOf(n);
    const c = { date: col('nav date'), isin: col('isin'), cur: col('currency'), nps: col('nav per share'), nav: col('nav'), so: col('shares in issue') };
    if (Object.values(c).some(i => i < 0)) continue;
    const map = new Map();
    rows.slice(hi + 1).forEach(r => { if (String(r[c.cur]).trim().toUpperCase() !== 'USD') return; const isin = String(r[c.isin]).trim().toUpperCase(); if (isin && !map.has(isin)) map.set(isin, r); });
    const toIso = v => { if (typeof v === 'number') { const d = X.SSF.parse_date_code(v); return d ? `${d.y}-${String(d.m).padStart(2, '0')}-${String(d.d).padStart(2, '0')}` : ''; }
      const t = String(v).trim(); let m = t.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return `${m[1]}-${m[2]}-${m[3]}`; m = t.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/); return m ? `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}` : ''; };
    return { map, c, toIso };
  }
  return null;
}
async function handleNavFiles(files, fid) {
  const cid = ui.cid, c = C(data, cid); if (!c) return;
  const file = files[0];
  let nf; try { nf = await readNavFile(file); } catch (e) { toast(`${file.name}: could not read this file`, true); return; }
  if (!nf) { toast(`${file.name}: no sheet with NAV Date / ISIN / Currency / NAV per share / NAV / Shares in Issue columns`, true); return; }
  const funds = fid ? [F(data, cid, fid)] : c.funds;
  let good = 0, bad = 0; const at = new Date().toISOString();
  funds.forEach(f => {
    const rows = [], errors = []; let valDate = '';
    f.classes.forEach(k => {
      if (!k.isin) { errors.push({ kid: k.id, code: k.code, msg: 'No ISIN set for this class' }); return; }
      const r = nf.map.get(k.isin.toUpperCase());
      if (!r) { errors.push({ kid: k.id, code: k.code, msg: 'ISIN not found (USD row) in file' }); return; }
      const tna = jnum(r[nf.c.nav]), nav = jnum(r[nf.c.nps]), so = jnum(r[nf.c.so]), vd = nf.toIso(r[nf.c.date]);
      if (!tna || !nav || !so) { errors.push({ kid: k.id, code: k.code, msg: 'Figures missing in file' }); return; }
      valDate = valDate || vd;
      if (navMismatch(tna, so, String(nav)) !== null) errors.push({ kid: k.id, code: k.code, msg: 'NAV does not tie — check' });
      rows.push({ kid: k.id, day: { tna, nav, navStr: String(nav), so, at, valDate: vd, src: 'json' }, setCode: '' });
    });
    if (!f.classes.length) return;
    applyJson(cid, f.id, { rows, errors, valDate, at, file: file.name, fundName: '' });
    errors.length ? bad++ : good++;
    if (errors.length) ui.open.add(f.id);
  });
  render();
  toast(bad ? `${file.name}: ${good} fund(s) captured correctly, ${bad} with errors — see red marks` : `${file.name}: all ${good} fund(s) captured correctly`, !!bad);
}

/* ===================== JSON IMPORT (BNYM CGT file) ===================== */
// header.accountNumber = Fund ID · header.valuationDate = val. date
// nav[] = one block per class: ClassCode, totalNetAssets, navPerShare, sharesOutstanding
const jnum = v => { const n = typeof v === 'number' ? v : parseNum(v); return n > 0 ? n : null; };
const sameId = (a, b) => String(a || '').trim().replace(/^0+/, '').toUpperCase() === String(b || '').trim().replace(/^0+/, '').toUpperCase();
function readJson(f, j, fileName) {
  const h = j && j.header, navs = j && Array.isArray(j.nav) ? j.nav.filter(x => x && String(x.ClassCode ?? '').trim() !== '0') : null;   // ClassCode 0 = total of all classes → ignored
  if (!h || !navs) return { fatal: `${fileName}: this is not a BNYM fund JSON (no "header" / "nav" section).` };
  if (!sameId(h.accountNumber, f.fundId)) return { fatal: `${fileName} is for fund ${h.accountNumber || '?'}, not ${f.fundId}.` };
  const valDate = /^\d{4}-\d{2}-\d{2}$/.test(h.valuationDate || '') ? h.valuationDate : '';
  const at = new Date().toISOString(), rows = [], errors = [], used = new Set();
  f.classes.forEach(k => {
    let e = k.code ? navs.find(x => String(x.ClassCode).trim() === k.code) : null;
    if (!e && !k.code) e = navs.find(x => String(x.ClassName || '').trim().toLowerCase() === k.name.trim().toLowerCase()) || (f.classes.length === 1 && navs.length === 1 ? navs[0] : null);
    if (!e) { errors.push({ kid: k.id, code: k.code, msg: k.code ? `Class code ${k.code} not in JSON` : 'Set class code, then re-upload' }); return; }
    used.add(e);
    const tna = jnum(e.totalNetAssets), nav = jnum(e.navPerShare), so = jnum(e.sharesOutstanding);
    if (!tna || !nav || !so) { errors.push({ kid: k.id, code: k.code, msg: 'Figures missing in JSON' }); return; }
    const day = { tna, nav, navStr: String(nav), so, at, valDate, src: 'json' };
    if (navMismatch(tna, so, String(nav)) !== null) errors.push({ kid: k.id, code: k.code, msg: 'NAV does not tie — check' });
    rows.push({ kid: k.id, day, setCode: k.code ? '' : String(e.ClassCode ?? '').trim() });
  });
  navs.filter(x => !used.has(x)).forEach(x => errors.push({ kid: '', code: String(x.ClassCode ?? '?'), msg: `Class code ${x.ClassCode ?? '?'} (${x.ClassName || 'no name'}) is in the JSON but not set up here` }));
  return { rows, errors, valDate, at, file: fileName, fundName: clean(h.accountName, 160) };
}
function applyJson(cid, fid, res) {
  const day = DAY;
  commit(d => {
    const f = F(d, cid, fid); if (!f) return;
    res.rows.forEach(r => { const k = f.classes.find(x => x.id === r.kid); if (!k) return; k.days[day] = r.day; k.days = cleanDays(k.days); if (r.setCode) k.code = r.setCode; });
    f.imports = f.imports || {}; f.imports[day] = { at: res.at, file: res.file, valDate: res.valDate, errors: res.errors }; f.imports = cleanImports(f.imports);
    if (!f.name && res.fundName) f.name = res.fundName;
  });
}
async function handleJsonFiles(files, fid) {
  const cid = ui.cid, c = C(data, cid); if (!c) return;
  let ok = 0, bad = 0;
  for (const file of files) {
    let j; try { if (file.size > 20e6) throw 0; j = JSON.parse(await file.text()); } catch (e) { toast(`${file.name}: could not read this file as JSON`, true); bad++; continue; }
    const acct = j && j.header && j.header.accountNumber;
    const f = fid ? F(data, cid, fid) : c.funds.find(x => sameId(x.fundId, acct));
    if (!f) { toast(`${file.name}: no fund with Fund ID ${acct || '?'} under ${c.name}`, true); bad++; continue; }
    const res = readJson(f, j, file.name);
    if (res.fatal) { toast(res.fatal, true); bad++; continue; }
    applyJson(cid, f.id, res); ui.open.add(f.id);
    if (res.errors.length) { bad++; toast(`${f.fundId}: captured ${res.rows.length - res.errors.filter(e => e.msg.startsWith('NAV')).length} class(es) — please check the class(es) marked in red`, true); }
    else { ok++; if (files.length === 1) toast(`${f.fundId}: all ${res.rows.length} class(es) captured correctly · val. date ${fmtD(res.valDate)}`); }
  }
  if (files.length > 1) toast(`${files.length} files: ${ok} fund(s) captured correctly${bad ? `, ${bad} with errors — see red marks` : ''}`, !!bad);
  render();
}

function resultHtml(k, d) {
  const tna = parseNum(d.tna), so = parseNum(d.so);
  if ([tna, parseNum(d.nav), so].some(Number.isNaN)) return `<div class="d-empty">One of the numbers has a typo. Use only digits, commas and one decimal point.</div>`;
  if (!(k.spb > 0)) return `<div class="d-empty">Set the shares per basket first (click the pencil at the top).</div>`;
  if (!(so > 0)) return `<div class="d-empty">Type the <b>Shares outstanding</b> above and the baskets appear here.</div>`;
  const r = calc(k.spb, so, k.intervals, kdef(k)), mm = navMismatch(tna, so, d.nav);
  return `<div class="total"><span class="l">Total number of baskets</span><span class="v num">${fmtN(r.baskets, 0)}</span></div>
    <div class="working num">${fmtN(so, 4)} shares ÷ ${fmtN(k.spb, 4)} per basket = ${fmtN(r.raw, 2)} → rounded to ${fmtN(r.baskets, 0)}</div>
    ${r.rows.length ? `<div class="ivl">${r.rows.map(x => `<div class="iv ${x.pct === null ? 'def' : ''}"><span class="n">Interval ${x.n} <small>(${x.pct === null ? 'Default · fixed' : x.pct + '%'})</small></span><span class="v">${fmtN(x.v, 0)}</span></div>`).join('')}</div>`

    ${mm !== null ? `<div class="warnbox">${ic('alert', 16)}<span>Please re-check: Total Net Assets ÷ Shares outstanding = <b>${fmtN(mm, 4)}</b>, which doesn't match the NAV per share you typed. One number may be from the wrong row or day.</span></div>` : ''}`;
}
function savedHtml(k) {

  if (s && D.dirty) return `<span class="saved no">${ic('alert', 14)} Changed — click Save</span>`;
  return `<span class="saved no">${ic('clock', 14)} Not saved yet today</span>`;
}

}

function addInterval() {
  const D = ui.drawer, cid = ui.cid, { fid, kid } = D;
  const v = parseNum(($('#newPct').value || '').replace('%', ''));
  if (!(v > 0) || v > 100) { $('#ivErr').textContent = 'Type a number between 0 and 100.'; return; }
  if (KL(data, cid, fid, kid).intervals.includes(v)) { $('#ivErr').textContent = v + '% is already there.'; return; }
  if (KL(data, cid, fid, kid).intervals.length >= maxPct(C(data, cid))) { $('#ivErr').textContent = 'Maximum intervals reached.'; return; }
  commit(d => { const x = KL(d, cid, fid, kid); if (x && !x.intervals.includes(v)) x.intervals = cleanInts([...x.intervals, v]); }, `${v}% interval added`);
  refreshAfterInterval();
}
function rmInterval(p) {
  const D = ui.drawer, cid = ui.cid, { fid, kid } = D;
  commit(d => { const x = KL(d, cid, fid, kid); if (x) x.intervals = x.intervals.filter(y => y !== p); }, `${p}% interval removed`);
  refreshAfterInterval();
}
function saveDefB() {
  const D = ui.drawer, cid = ui.cid, { fid, kid } = D, raw = $('#defB').value.trim();
  const v = raw === '' ? null : parseNum(raw);
  if (v !== null && !(v >= 0 && Number.isInteger(v))) { $('#ivErr').textContent = 'Default must be a whole number (0 or more), or blank.'; return; }
  commit(d => { const x = KL(d, cid, fid, kid); if (x) x.defB = v; }, v === null ? 'Default reset to client value' : `Default interval set to ${v}`);
  refreshAfterInterval();
}
function refreshAfterInterval() {
  const D = ui.drawer, k = KL(data, ui.cid, D.fid, D.kid);
  $('#dres').innerHTML = resultHtml(k, D.draft); openIntervals();
}

async function importData(file) {
  let d; try { d = JSON.parse(await file.text()); } catch (e) { toast('That file is not a valid backup', true); return; }
  if (!d || !Array.isArray(d.clients)) { toast('That file is not a GMK Basket Calculator backup', true); return; }
  const nd = normalize(d), nf = nd.clients.reduce((a, c) => a + c.funds.length, 0);
  if (!(await confirmBox('Replace all data?', `Loads ${plural(nd.clients.length, 'client')} and ${plural(nf, 'fund')} from ${file.name}. Everything currently in the tool is replaced — for the whole team.`, 'Replace all'))) return;
  // Loaded figures count as TODAY's filing, whatever day you import (each class keeps its own val. date)
  nd.clients.forEach(c => c.funds.forEach(f => {
    f.classes.forEach(k => { const last = Object.keys(k.days).sort().pop(); if (last && last !== DAY) k.days[DAY] = k.days[last]; });
    const li = Object.keys(f.imports || {}).sort().pop(); if (li && li !== DAY) f.imports[DAY] = f.imports[li];
  }));
  const clients = nd.clients, colors = nd.colors;
  commit(d0 => { d0.clients = clone(clients); d0.colors = clone(colors); }, 'Data imported');
  closeModal(); go(null);
}

function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
/* Final Excel — one header row, one row per class, built for other tools to read.
   Sheet "Baskets": wide (Interval 1 %, Interval 1 baskets, …). Sheet "Intervals": one row per interval. */
async function downloadFinal(cid) {
  const c = C(data, cid); if (!c) return;
  if (!clientReady(c)) { toast('Some classes are still pending today', true); return; }
  const res = new Map(); c.funds.forEach(f => f.classes.forEach(k => res.set(k.id, calc(k.spb, k.days[DAY].so, k.intervals, defFor(c, k)))));
  const maxN = Math.max(0, ...[...res.values()].map(r => r.rows.length));
  // label "Interval 2 (1%)" when every class has the same interval at that position, else just "Interval 2"
  const ivHead = [...Array(maxN)].map((_, i) => { const ls = [...new Set([...res.values()].map(r => r.rows[i] && ivLabel(r.rows[i])).filter(Boolean))]; return ls.length === 1 ? ls[0] : `Interval ${i + 1}`; });
  const head = ['Fund ID', 'Class code', 'Val. date', 'Number of Shares per Basket', 'totalNetAssets', 'navPerShare', 'sharesOutstanding', 'Total Number of Baskets', ...ivHead];
  const rows = [];
  c.funds.forEach(f => f.classes.forEach((k, idx) => {
    const d = k.days[DAY], r = res.get(k.id);
    rows.push([f.fundId, k.code || String(idx + 1), fmtD(d.valDate), k.spb, d.tna, d.nav, d.so, r.baskets, ...[...Array(maxN)].map((_, i) => r.rows[i] ? r.rows[i].v : '')]);
  }));
  const fname = `Baskets_${c.name.replace(/[^\w-]+/g, '_')}_${DAY}`;
  try {
    if (!window.XLSX) { toast('Preparing Excel…'); await loadScript('https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js'); }
    const X = window.XLSX, wb = X.utils.book_new(), ws = X.utils.aoa_to_sheet([head, ...rows]);
    ws['!cols'] = head.map(h => ({ wch: Math.max(12, h.length + 2) }));
    X.utils.book_append_sheet(wb, ws, 'Baskets'); X.writeFile(wb, fname + '.xlsx'); toast('Excel downloaded');
  } catch (e) {
    const csv = [head, ...rows].map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
    const u = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' })), a = document.createElement('a');
    a.href = u; a.download = fname + '.csv'; a.click(); setTimeout(() => URL.revokeObjectURL(u), 1000); toast('Excel library unavailable — downloaded CSV instead');
  }
}

async function saveFramework() {
  const set = {};
  for (const c of data.clients) {
    const on = $(`[data-fw="${c.id}"]`).checked, b = parseNum($(`[data-fwb="${c.id}"]`).value);
    if (!(b >= 0 && Number.isInteger(b))) { $('#fwErr').textContent = `${c.name}: default baskets must be a whole number.`; return; }
    if (on) { const over = allClasses(c).filter(k => k.intervals.length > MAX_TOTAL - 1); if (over.length) { $('#fwErr').textContent = `${c.name}: ${over.length} class(es) have 8 % intervals — remove one first (max 1 Default + 7).`; return; } }
    set[c.id] = { framework: on ? 'default' : 'standard', defB: b };
  }
  const moving = data.clients.filter(c => set[c.id].framework !== c.framework);
  if (moving.length && !(await confirmBox('Change framework?', moving.map(c => `${c.name}: ${set[c.id].framework === 'default' ? 'move TO Default framework' : 'go BACK to the current framework'}`).join(' · ') + '. This applies for the whole team.', 'Yes, change'))) return;
  closeModal();
  commit(d => d.clients.forEach(c => { if (set[c.id]) Object.assign(c, set[c.id]); }), 'Framework saved');
}

async function genTeamKey() {
  const st = $('#k-state');
  const conn = { owner: $('#k-owner').value.trim(), repo: $('#k-repo').value.trim() || CONFIG.github.repo, branch: CONFIG.github.branch, path: CONFIG.github.path };
  const token = $('#k-token').value.trim();
  st.className = 'conn wait'; st.innerHTML = ic('refresh', 15) + ' Checking access…';
  try {
    if (!conn.owner) throw new Error('Enter your GitHub username');
    const c = gh({ ...conn, token }); validConn(c);
    const r = await ghGet(c);
    const base = r.data ? normalize(r.data) : clone(data); stamp(base);
    const res = await ghPut(base, r.sha, c); if (res.conflict) throw new Error('Someone saved at the same moment — try again');
    const code = await lockTeamKey(session.pin, { t: token, ...conn });
    localStorage.setItem(K.teamKey, code);
    session.token = token; session.conn = conn; data = base; saveLocal(); render();
    lastSync = new Date(); setSync('synced');
    st.className = 'conn ok'; st.innerHTML = ic('check', 15) + ' Connected. Team sync is ON on this device.';
    $('#k-code').value = `  teamKey: '${code}',`; $('#k-out').classList.remove('hidden');
  } catch (err) { st.className = 'conn bad'; st.innerHTML = ic('alert', 15) + ' ' + esc(err.message); }
}

    case 'edit-fund': ACTIONS.editFund(a.dataset.fid); break;
    case 'del-fund': {
      const cid = ui.cid, f = F(data, cid, a.dataset.fid);
      if (!(await confirmBox(`Delete fund ${f.fundId}?`, 'This deletes the fund with all its classes and saved figures — for everyone.'))) break;
      commit(d => { const c = C(d, cid); if (c) c.funds = c.funds.filter(x => x.id !== f.id); }, `Fund ${f.fundId} deleted`); break;
    }
    case 'add-class': ACTIONS.addClass(a.dataset.fid); break;
    case 'edit-class': ACTIONS.editClass(a.dataset.fid, a.dataset.kid); break;
    case 'toggle-fund': { const id = a.dataset.fid; ui.open.has(id) ? ui.open.delete(id) : ui.open.add(id); render(); break; }
    case 'toggle-all': { const c = C(data, ui.cid), all = c.funds.every(f => ui.open.has(f.id)); c.funds.forEach(f => all ? ui.open.delete(f.id) : ui.open.add(f.id)); render(); break; }
    case 'clear-filter': ui.q = ''; ui.person = ''; render(); break;
    case 'final-excel': if (!a.disabled) downloadFinal(a.dataset.cid); break;
    case 'pick-fund': ui.q = a.dataset.q; ui.person = ''; render(); break;
    case 'upload-json': ui.uploadFid = a.dataset.fid || null; $('#jsonFile').value = ''; $('#jsonFile').click(); break;
    case 'open-class': openClass(a.dataset.fid, a.dataset.kid); break;
    case 'close-drawer': closeDrawer(); break;
    case 'save-day': saveDay(); break;
    case 'copy': copyResult(); break;
    case 'intervals': openIntervals(); break;
    case 'add-interval': addInterval(); break;
    case 'save-defb': saveDefB(); break;
    case 'rm-interval': rmInterval(+a.dataset.p); break;
    case 'settings': openSettings(); break;
    case 'close-modal': closeModal(); break;
    case 'refresh': if (mode() === 'local') toast('Team sync is not set up — open Settings'); else await pull(true); break;
    case 'lock': lockNow(); break;
    case 'sync-setup': openSyncSetup(); break;
    case 'framework': openFramework(); break;
    case 'save-framework': saveFramework(); break;
    case 'gen-key': genTeamKey(); break;
    case 'copy-key': { const t = $('#k-code'); t.select(); try { await navigator.clipboard.writeText(t.value); } catch (e) { document.execCommand('copy'); } toast('Copied — paste it into index.html'); break; }
    case 'import': $('#importFile').value = ''; $('#importFile').click(); break;
    case 'export': {
      const u = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' })), l = document.createElement('a');
      l.href = u; l.download = `GMK-Baskets-backup-${DAY}.json`; l.click(); setTimeout(() => URL.revokeObjectURL(u), 1000); break;
    }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('#modalWrap').classList.contains('show')) closeModal(); else if (ui.drawer) closeDrawer(); }
  if (e.key === 'Enter' && e.target.id === 'newPct') { e.preventDefault(); addInterval(); }
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.fig) {
    e.preventDefault(); const order = ['tna', 'nav', 'so'], i = order.indexOf(e.target.dataset.fig);
    if (i < 2) $(`[data-fig="${order[i + 1]}"]`).focus(); else saveDay();
  }
});

/* ===================== LOCK SCREEN ===================== */
let pin = '', busy = false;
function buildKeypad() {
  $('#keypad').innerHTML = ['1','2','3','4','5','6','7','8','9','','0','⌫'].map(k =>
    k === '' ? '<span class="key blank"></span>' : `<button class="key" data-k="${k}">${k === '⌫' ? ic('back', 20) : k}</button>`).join('');
  $('#keypad').addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) press(b.dataset.k); });
}
function press(k) {
  if ($('#lock').classList.contains('out') || busy) return;
  if (k === '⌫') pin = pin.slice(0, -1); else if (pin.length < 4) pin += k;
  $('#lockMsg').textContent = '';
  const dots = $('#pinDots'); dots.classList.remove('err');
  [...dots.children].forEach((s, i) => s.classList.toggle('on', i < pin.length));
  if (pin.length === 4) setTimeout(checkPin, 120);
}
const failState = () => lsGet(K.fail, { n: 0, until: 0 });
function resetPin(msg, err) {
  const dots = $('#pinDots'), card = $('#lockCard');
  if (err) { dots.classList.add('err'); card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); }
  $('#lockMsg').textContent = msg || '';
  setTimeout(() => { pin = ''; dots.classList.remove('err'); [...dots.children].forEach(s => s.classList.remove('on')); busy = false; }, 500);
}
async function checkPin() {
  if (busy) return; busy = true;
  const p = pin, f0 = failState();
  if (f0.until > Date.now()) { resetPin(`Too many attempts. Try again in ${Math.ceil((f0.until - Date.now()) / 1000)} s.`, true); return; }
  if (!window.crypto || !crypto.subtle) { resetPin('Please open the https:// link (secure mode needed).', true); return; }
  $('#lockMsg').style.color = 'var(--muted)'; $('#lockMsg').textContent = 'Verifying…';
  let ok = false;
  try {
    let salt = localStorage.getItem(K.salt);
    if (!salt) { salt = toB64(crypto.getRandomValues(new Uint8Array(16))); localStorage.setItem(K.salt, salt); }
    const key = await deriveKey(p, salt);
    for (const code of [CONFIG.teamKey, localStorage.getItem(K.teamKey)].filter(Boolean)) {
      try { const t = await openTeamKey(p, code); session.token = t.t; session.conn = { owner: t.owner, repo: t.repo, branch: t.branch, path: t.path }; ok = true; break; } catch (e) {}
    }
    if (!ok && (await sha256hex('gmk-workboard:' + p)) === CONFIG.pinHash) ok = true;
    if (ok) { session.key = key; session.pin = p; }
  } catch (e) { ok = false; }
  $('#lockMsg').style.color = '';
  if (ok) { lsSet(K.fail, { n: 0, until: 0 }); pin = ''; busy = false; await afterUnlock(); return; }
  const f = failState(); f.n++;
  if (f.n % CONFIG.maxAttempts === 0) f.until = Date.now() + 60000 * Math.pow(2, f.n / CONFIG.maxAttempts - 1);
  lsSet(K.fail, f);
  resetPin(f.until > Date.now() ? `Too many attempts. Locked for ${Math.round((f.until - Date.now()) / 60000)} min.` : `Incorrect PIN. ${CONFIG.maxAttempts - (f.n % CONFIG.maxAttempts)} attempt(s) left.`, true);
}
async function afterUnlock() {
  const cache = lsGet(K.cache, null);
  if (cache) { try { data = normalize(await unseal(session.key, cache)); } catch (e) {} }
  $('#lock').classList.add('out'); setTimeout(() => $('#lock').classList.add('hidden'), 350);
  $('#app').classList.remove('hidden');
  startApp();
  if (!session.token) setTimeout(() => toast('Team sync is not set up — changes stay on this device', true), 600);
}
let lastActive = Date.now();
['pointermove', 'keydown', 'click', 'scroll', 'touchstart'].forEach(ev => document.addEventListener(ev, () => { lastActive = Date.now(); }, { passive: true, capture: true }));
async function lockNow() {
  if (pending.length && mode() === 'live') { toast('Saving your changes before locking…'); try { await doSync(); } catch (e) {} }
  location.hash = '#/'; location.reload();
}
document.addEventListener('keydown', e => {
  if ($('#lock').classList.contains('out')) return;
  if (/^[0-9]$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('⌫');
});

/* ===================== START ===================== */
let started = false;
function startApp() {
  if (started) return; started = true;
  routeFromHash(); render();
  setSync(mode() === 'local' ? 'local' : 'synced');
  if (mode() !== 'live') setSync('local');
  setInterval(() => { if (session.key && Date.now() - lastActive > CONFIG.autoLockMinutes * 60000 && !(ui.drawer && ui.drawer.dirty)) lockNow(); }, 20000);
  // Midnight reset: when the date changes, today's boxes become blank
  setInterval(() => {
    const now = todayKey(); if (now === DAY) return;
    DAY = now;
    if (ui.drawer) { ui.drawer.draft = { tna: '', nav: '', so: '' }; ui.drawer.dirty = false; }
    render(); toast('New day — enter today\'s figures');
  }, 20000);
  if (mode() === 'live') pull(true, true);
  setInterval(() => pull(false), CONFIG.pollSeconds * 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) pull(false); });
}
paintIcons();
$('#rsTop').href = CONFIG.reportStudioUrl;
buildKeypad();
if (window.top !== window.self) { try { window.top.location = window.self.location.href; } catch (e) { document.body.innerHTML = ''; } }   // anti-clickjacking
</script>
